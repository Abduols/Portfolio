<!-- @format -->

<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="style.css" />
		<title>Guessing Game</title>
	</head>
	<body>
		<div class="container">
			<h1>Number Guessing Game</h1>
			<div class="game">
				<p>I'm thinking of a number between 1 to 50</p>

				<input type="number" id="guess" placeholder="Guess my thought!" />
			</div>
			<button id="btn" type="submit">Guess!</button>
			<div class="result">
				<p id="message">tis is a feedback message</p>
				<p>Attempts: <span id="attempts">0\15</span></p>
			</div>
			<button id="btn-reset" class="reset">Reset</button>
		</div>

		<script src="script.js"></script>
	</body>
</html>
